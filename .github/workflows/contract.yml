name: Build

on:
  push:
    branches: [ main, develop, drip ]
  pull_request:
    branches: [ main, develop, drip ]

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, Lint & Cargo Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Log and verify Rust version
        run: |
          rustc --version
          PINNED=$(grep 'channel' rust-toolchain.toml | cut -d'"' -f2 | tr -d '[:space:]')
          echo "Pinned version in rust-toolchain.toml: $PINNED"
          if [ -z "$PINNED" ]; then
            echo "::error::Could not determine pinned channel from rust-toolchain.toml"
            exit 1
          fi
          if ! rustc --version | grep -Fq "$PINNED"; then
            echo "::error::Installed rustc version does not match pinned version ($PINNED)"
            exit 1
          fi

      - name: Add wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Build collateral-vault WASM for upgrade tests
        run: cargo build --locked -p collateral-vault --target wasm32v1-none --release

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check --verbose

  build:
    name: Build Contracts (wasm32v1-none)
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Log and verify Rust version
        run: |
          rustc --version
          PINNED=$(grep 'channel' rust-toolchain.toml | cut -d'"' -f2 | tr -d '[:space:]')
          echo "Pinned version in rust-toolchain.toml: $PINNED"
          if [ -z "$PINNED" ]; then
            echo "::error::Could not determine pinned channel from rust-toolchain.toml"
            exit 1
          fi
          if ! rustc --version | grep -Fq "$PINNED"; then
            echo "::error::Installed rustc version does not match pinned version ($PINNED)"
            exit 1
          fi

      - name: Add wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Build Soroban contracts
        run: |
          cargo build \
            -p collateral-vault \
            -p lending-pool \
            -p liquidation-engine \
            -p oracle-adapter \
            --target wasm32v1-none \
            --release \
            --verbose

  test:
    name: Run Tests (native)
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Log and verify Rust version
        run: |
          rustc --version
          PINNED=$(grep 'channel' rust-toolchain.toml | cut -d'"' -f2 | tr -d '[:space:]')
          echo "Pinned version in rust-toolchain.toml: $PINNED"
          if [ -z "$PINNED" ]; then
            echo "::error::Could not determine pinned channel from rust-toolchain.toml"
            exit 1
          fi
          if ! rustc --version | grep -Fq "$PINNED"; then
            echo "::error::Installed rustc version does not match pinned version ($PINNED)"
            exit 1
          fi

      - name: Add wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Build collateral-vault WASM for upgrade tests
        run: cargo build --locked -p collateral-vault --target wasm32v1-none --release

      - name: Verify pinned Rust toolchain
        run: |
          rustc --version
          pinned=$(grep -E '^channel' rust-toolchain.toml | sed -E 's/.*"(.*)".*/\1/')
          actual=$(rustc --version | awk '{print $2}')
          echo "Pinned: $pinned, Actual: $actual"
          test "$actual" = "$pinned"

      - name: Run Cargo tests
        run: cargo test --locked --workspace --all-features --verbose