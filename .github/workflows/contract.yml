name: Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, Lint & Cargo Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Add wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Build collateral-vault WASM for upgrade tests
        run: cargo build --locked -p collateral-vault --target wasm32v1-none --release

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check --verbose

  build:
    name: Build Contracts (wasm32v1-none)
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Add wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Install Stellar CLI
        uses: taiki-e/install-action@v2
        with:
          tool: stellar-cli

      # Keep CI aligned with the contributor-facing canonical build. Besides
      # compiling, Stellar CLI validates contract metadata and performs the
      # production WASM optimization pipeline.
      - name: Build and validate Soroban contracts with Stellar CLI
        run: stellar contract build --locked

      - name: Verify release WASM artifacts
        run: test -n "$(find target/wasm32v1-none/release -maxdepth 1 -name '*.wasm' -print -quit)"

  test:
    name: Run Tests (native)
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Add wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Build collateral-vault WASM for upgrade tests
        run: cargo build --locked -p collateral-vault --target wasm32v1-none --release

      - name: Run Cargo tests
        run: cargo test --locked --workspace --all-features --verbose
