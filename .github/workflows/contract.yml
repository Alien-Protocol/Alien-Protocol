name: Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, Lint & Cargo Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build collateral-vault WASM for upgrade tests
        run: cargo build -p collateral-vault --target wasm32v1-none --release

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check --verbose

  build:
    name: Build Contracts (wasm32v1-none)
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v28.0.0

      - name: Build Soroban contracts (Stellar CLI)
        run: stellar contract build --locked

      - name: Verify WASM artifacts
        run: |
          for c in collateral_vault lending_pool liquidation_engine oracle_adapter; do
            test -s "target/wasm32v1-none/release/${c}.wasm" || { echo "Missing ${c}.wasm"; exit 1; }
          done

  test:
    name: Run Tests (native)
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build collateral-vault WASM for upgrade tests
        run: cargo build -p collateral-vault --target wasm32v1-none --release

      - name: Run Cargo tests
        run: cargo test --workspace --all-features --verbose
