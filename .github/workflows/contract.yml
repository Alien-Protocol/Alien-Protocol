name: Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Format, Lint & Cargo Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache strategy:
      # - Cache paths:
      #   * ~/.cargo/registry/index/ & ~/.cargo/registry/cache/: Cargo package index and downloaded crate archives.
      #   * ~/.cargo/git/db/: Git dependencies repository database.
      #   * target/: Compiled build artifacts and workspace dependencies.
      # - Cache key: Runner OS + hash of Cargo.lock ensures invalidation whenever dependencies change.
      # - Restore key: OS prefix fallback restores the latest cache if Cargo.lock changes, minimizing recompilation.
      - name: Cache Cargo dependencies and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build collateral-vault WASM for upgrade tests
        run: cargo build -p collateral-vault --target wasm32v1-none --release

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check --verbose

  build:
    name: Build Contracts (wasm32v1-none)
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache strategy:
      # - Cache paths:
      #   * ~/.cargo/registry/index/ & ~/.cargo/registry/cache/: Cargo package index and downloaded crate archives.
      #   * ~/.cargo/git/db/: Git dependencies repository database.
      #   * target/: Compiled build artifacts and workspace dependencies.
      # - Cache key: Runner OS + hash of Cargo.lock ensures invalidation whenever dependencies change.
      # - Restore key: OS prefix fallback restores the latest cache if Cargo.lock changes, minimizing recompilation.
      - name: Cache Cargo dependencies and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build Soroban contracts
        run: |
          cargo build \
            -p collateral-vault \
            -p lending-pool \
            -p liquidation-engine \
            -p oracle-adapter \
            --target wasm32v1-none \
            --release \
            --verbose

  test:
    name: Run Tests (native)
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Cache strategy:
      # - Cache paths:
      #   * ~/.cargo/registry/index/ & ~/.cargo/registry/cache/: Cargo package index and downloaded crate archives.
      #   * ~/.cargo/git/db/: Git dependencies repository database.
      #   * target/: Compiled build artifacts and workspace dependencies.
      # - Cache key: Runner OS + hash of Cargo.lock ensures invalidation whenever dependencies change.
      # - Restore key: OS prefix fallback restores the latest cache if Cargo.lock changes, minimizing recompilation.
      - name: Cache Cargo dependencies and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build collateral-vault WASM for upgrade tests
        run: cargo build -p collateral-vault --target wasm32v1-none --release

      - name: Run Cargo tests
        run: cargo test --workspace --all-features --verbose
